# ============================================================
#  Deploy iLOVECLIM docs to GitHub Pages
#  Place this file at:  .github/workflows/docs.yml
# ============================================================
name: docs

on:
  push:
    branches: [main]
    paths:                      # only rebuild when docs actually change
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # Also build (without deploying) on PRs, so broken docs are caught in review:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"

# Permissions the Pages deployment needs
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin versions so a surprise upstream release can't break your build.
      - name: Install MkDocs Material
        run: pip install "mkdocs-material==9.*"

      - name: Build site (strict — fails on broken links)
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy only on pushes to main, never on PRs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
